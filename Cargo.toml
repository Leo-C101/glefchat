[package]
name = "oxide-rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "1.18.1"
tokio = { version = "1.53.1", features = ["full"] }
argon2 = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
rfd = "0.17.2"
dirs = "7.0.0"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.14.10"
tokio-rustls = "0.26"
chrono = "0.4.45"

[build-dependencies]
slint-build = "1.18.1"
